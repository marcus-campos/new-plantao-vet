services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: plantaovet
      POSTGRES_PASSWORD: plantaovet
      POSTGRES_DB: plantaovet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantaovet"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./src/back
    environment:
      DATABASE_URL: postgresql+asyncpg://plantaovet:plantaovet@postgres:5432/plantaovet
      JWT_SECRET: dev-secret-change-me
      ENV: docker
      # Origem do web em container (8080) e do dev server do Vite (5173).
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./src/front
      args:
        VITE_API_URL: http://localhost:8000
        # Do .env da raiz, quando existir. Ver src/front/.env.example.
        VITE_FIREBASE_CONFIG: ${VITE_FIREBASE_CONFIG:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
