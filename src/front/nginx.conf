server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: qualquer rota cai no index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker e o manifest NÃO podem ficar 30 dias em cache: uma
    # versão nova do worker precisa chegar na próxima abertura, senão o push
    # continua rodando código velho com a aba fechada, onde ninguém vê erro.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
