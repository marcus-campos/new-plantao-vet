<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- O relógio da internação: o produto inteiro é sobre a hora em que a dose
       precisa acontecer. O ponteiro marca 22h, e o ponto vermelho é a dose que
       passou da janela — a mesma cor de atraso que a ficha usa. -->
  <rect width="32" height="32" rx="7" fill="#0c6b58"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.92"/>
  <path d="M16 10.5V16l3.8 2.4" fill="none" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24.5" cy="8" r="4" fill="#a83a31" stroke="#0c6b58" stroke-width="1.6"/>
</svg>
