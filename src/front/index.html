<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlantãoVet</title>
    <!-- Sem isto o link deste cadastro vira URL nua no WhatsApp e no
         Instagram, que é exatamente onde ele vai ser compartilhado. Sem
         og:image de propósito: não existe arte pronta, e uma imagem quebrada
         é pior que nenhuma. -->
    <meta
      name="description"
      content="A ficha de internação que faz o plantão passar direito: prescrição, aprazamento e passagem de plantão num lugar só. Teste 14 dias, sem cartão."
    />
    <meta property="og:title" content="PlantãoVet — a ficha de internação que faz o plantão passar direito" />
    <meta
      property="og:description"
      content="Prescrição, aprazamento e passagem de plantão num lugar só. Teste 14 dias, sem cartão."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c6b58" />
    <!-- Na tela inicial do celular: sem barra do navegador, com o ícone certo.
         O iOS ignora o manifest para isto e lê estas três linhas. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlantãoVet" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
